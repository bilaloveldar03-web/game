name: Free football data sync
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data-sync/**'
      - '.github/workflows/free-data-sync.yml'
permissions:
  contents: write
concurrency:
  group: free-football-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and refresh public data
        run: python data-sync/collector.py
      - name: Publish changed data only
        shell: bash
        run: |
          git add -- data/live.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh free football feed'
            git push
          fi
